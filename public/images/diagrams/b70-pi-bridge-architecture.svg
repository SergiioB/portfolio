<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Pi-Bridge inference topology: Rock 5B to Arc Pro B70">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow4"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="24" fill="url(#bg4)"/>

  <text x="72" y="60" fill="#f8fafc" font-size="30" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="700">
    The Pi-Bridge: a 5W ARM board driving a 150W GPU
  </text>
  <text x="72" y="92" fill="#94a3b8" font-size="16" font-family="Segoe UI, Inter, Arial, sans-serif">
    Production inference topology — single interactive user, low-power always-on front-end.
  </text>

  <!-- Rock 5B box (left) -->
  <g transform="translate(72, 160)">
    <rect x="0" y="0" width="320" height="280" rx="16" fill="#1e293b" stroke="#0ea5e9" stroke-width="2" filter="url(#glow4)"/>
    <text x="160" y="42" fill="#7dd3fc" font-size="22" font-family="Segoe UI" text-anchor="middle" font-weight="700">Radxa ROCK 5B+</text>
    <text x="160" y="68" fill="#94a3b8" font-size="14" font-family="Segoe UI" text-anchor="middle">ARM aarch64 · 5W idle</text>
    <line x1="20" y1="84" x2="300" y2="84" stroke="#334155"/>
    <text x="20" y="112" fill="#e2e8f0" font-size="14" font-family="Segoe UI">· Telegram bridge (always-on)</text>
    <text x="20" y="138" fill="#e2e8f0" font-size="14" font-family="Segoe UI">· lmx CLI → localmaxxing submit</text>
    <text x="20" y="164" fill="#e2e8f0" font-size="14" font-family="Segoe UI">· HTTP client to B70 :8765</text>
    <text x="20" y="190" fill="#e2e8f0" font-size="14" font-family="Segoe UI">· Tailscale mesh</text>
    <text x="20" y="226" fill="#94a3b8" font-size="13" font-family="Segoe UI" font-style="italic">Cost: ~$80 · sips power</text>
    <text x="20" y="250" fill="#94a3b8" font-size="13" font-family="Segoe UI" font-style="italic">Survives GPU reboots</text>
  </g>

  <!-- arrow between -->
  <g transform="translate(440, 290)">
    <line x1="0" y1="0" x2="200" y2="0" stroke="#64748b" stroke-width="3" marker-end="url(#arrow4)"/>
    <text x="100" y="-14" fill="#94a3b8" font-size="13" font-family="Segoe UI" text-anchor="middle">HTTP / LAN</text>
    <text x="100" y="22" fill="#64748b" font-size="12" font-family="Segoe UI" text-anchor="middle">192.168.1.x</text>
  </g>

  <!-- B70 box (right) -->
  <g transform="translate(688, 160)">
    <rect x="0" y="0" width="440" height="280" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#glow4)"/>
    <text x="220" y="42" fill="#34d399" font-size="22" font-family="Segoe UI" text-anchor="middle" font-weight="700">Intel Arc Pro B70</text>
    <text x="220" y="68" fill="#94a3b8" font-size="14" font-family="Segoe UI" text-anchor="middle">32GB GDDR6 · 608 GB/s · Xe2 · 150W</text>
    <line x1="20" y1="84" x2="420" y2="84" stroke="#334155"/>
    <text x="20" y="112" fill="#e2e8f0" font-size="14" font-family="Segoe UI">PRODUCTION: llama.cpp SYCL b10255+ (0804)</text>
    <text x="20" y="138" fill="#86efac" font-size="13" font-family="Segoe UI">  → ThinkingCap-Qwen3.6-27B Q6_K-MTP @128K</text>
    <text x="20" y="160" fill="#94a3b8" font-size="13" font-family="Segoe UI">  · 24-30 t/s decode (MTP-4) · q8_0/q4_1 KV</text>
    <text x="20" y="184" fill="#e2e8f0" font-size="14" font-family="Segoe UI">BENCH: vLLM 0.21 + 4 patches</text>
    <text x="20" y="206" fill="#7dd3fc" font-size="13" font-family="Segoe UI">  → MoE 35B GPTQ-Int4 + MTP = 126 t/s</text>
    <text x="20" y="240" fill="#94a3b8" font-size="13" font-family="Segoe UI" font-style="italic">~$600 · the inference workhorse</text>
    <text x="20" y="262" fill="#94a3b8" font-size="13" font-family="Segoe UI" font-style="italic">user systemd unit, Restart=on-failure</text>
  </g>

  <!-- footer -->
  <text x="72" y="488" fill="#64748b" font-size="13" font-family="Segoe UI, Inter, Arial, sans-serif">
    Why llama.cpp stays production: the bridge is single-user interactive — vLLM's wins (prefill + concurrency) don't help one chat user. vLLM wins the moment you serve an API.
  </text>
</svg>
