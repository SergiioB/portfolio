<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Four patches that unlocked MTP speculative decoding on XPU GDN">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow2"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg2)"/>

  <text x="72" y="64" fill="#f8fafc" font-size="30" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="700">
    Four patches: 72.6 → 126 t/s (MTP on XPU GDN, unlocked)
  </text>
  <text x="72" y="96" fill="#94a3b8" font-size="16" font-family="Segoe UI, Inter, Arial, sans-serif">
    "Known impossible" → four targeted fixes → first vLLM XPU result beating llama.cpp MoE parity.
  </text>

  <!-- baseline box -->
  <g transform="translate(72, 160)">
    <rect x="0" y="0" width="200" height="110" rx="14" fill="#1e293b" stroke="#475569"/>
    <text x="100" y="36" fill="#cbd5e1" font-size="14" font-family="Segoe UI" text-anchor="middle" font-weight="700">Run 17 baseline</text>
    <text x="100" y="68" fill="#f59e0b" font-size="30" font-family="Segoe UI" text-anchor="middle" font-weight="800">72.6</text>
    <text x="100" y="92" fill="#94a3b8" font-size="13" font-family="Segoe UI" text-anchor="middle">native int4, no spec</text>
  </g>
  <line x1="278" y1="215" x2="320" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- patch 1 -->
  <g transform="translate(326, 130)">
    <rect x="0" y="0" width="180" height="170" rx="14" fill="#0f766e" fill-opacity="0.15" stroke="#14b8a6"/>
    <text x="90" y="34" fill="#5eead4" font-size="13" font-family="Segoe UI" text-anchor="middle" font-weight="700">PATCH 1</text>
    <text x="90" y="60" fill="#e2e8f0" font-size="14" font-family="Segoe UI" text-anchor="middle" font-weight="600">Native int4 dtype</text>
    <text x="14" y="92" fill="#cbd5e1" font-size="12" font-family="Segoe UI">implement_zp → torch.int8</text>
    <text x="14" y="112" fill="#cbd5e1" font-size="12" font-family="Segoe UI">so C++ is_B_int4=kChar fires</text>
    <text x="14" y="138" fill="#94a3b8" font-size="11" font-family="Segoe UI" font-style="italic">root cause: uint8 vs int8</text>
    <text x="14" y="156" fill="#94a3b8" font-size="11" font-family="Segoe UI" font-style="italic">(one-bit dtype bug)</text>
  </g>
  <line x1="514" y1="215" x2="546" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- patch 2 -->
  <g transform="translate(552, 130)">
    <rect x="0" y="0" width="180" height="170" rx="14" fill="#7c3aed" fill-opacity="0.15" stroke="#8b5cf6"/>
    <text x="90" y="34" fill="#c4b5fd" font-size="13" font-family="Segoe UI" text-anchor="middle" font-weight="700">PATCH 2</text>
    <text x="90" y="60" fill="#e2e8f0" font-size="14" font-family="Segoe UI" text-anchor="middle" font-weight="600">BF16 MTP draft</text>
    <text x="14" y="92" fill="#cbd5e1" font-size="12" font-family="Segoe UI">strip quant_config for any</text>
    <text x="14" y="110" fill="#cbd5e1" font-size="12" font-family="Segoe UI">prefix containing "mtp"</text>
    <text x="14" y="138" fill="#94a3b8" font-size="11" font-family="Segoe UI" font-style="italic">fixes KeyError: w2_weight</text>
    <text x="14" y="156" fill="#94a3b8" font-size="11" font-family="Segoe UI" font-style="italic">(GPTQ-inherited draft)</text>
  </g>
  <line x1="740" y1="215" x2="772" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- patch 3 -->
  <g transform="translate(778, 130)">
    <rect x="0" y="0" width="160" height="170" rx="14" fill="#b45309" fill-opacity="0.15" stroke="#f59e0b"/>
    <text x="80" y="34" fill="#fcd34d" font-size="13" font-family="Segoe UI" text-anchor="middle" font-weight="700">PATCH 3</text>
    <text x="80" y="60" fill="#e2e8f0" font-size="13" font-family="Segoe UI" text-anchor="middle" font-weight="600">kwarg strip</text>
    <text x="12" y="92" fill="#cbd5e1" font-size="12" font-family="Segoe UI">drop is_fp8 / is_mxfp4</text>
    <text x="12" y="110" fill="#cbd5e1" font-size="12" font-family="Segoe UI">from XpuFusedMoe call</text>
    <text x="12" y="138" fill="#94a3b8" font-size="11" font-family="Segoe UI" font-style="italic">kernels auto-detect</text>
    <text x="12" y="156" fill="#94a3b8" font-size="11" font-family="Segoe UI" font-style="italic">dtype from weights</text>
  </g>
  <line x1="946" y1="215" x2="978" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- patch 4 (the big one) -->
  <g transform="translate(984, 130)">
    <rect x="0" y="0" width="170" height="170" rx="14" fill="#be123c" fill-opacity="0.18" stroke="#f43f5e" filter="url(#glow2)"/>
    <text x="85" y="34" fill="#fda4af" font-size="13" font-family="Segoe UI" text-anchor="middle" font-weight="700">PATCH 4</text>
    <text x="85" y="60" fill="#e2e8f0" font-size="13" font-family="Segoe UI" text-anchor="middle" font-weight="600">GDN assert → warn</text>
    <text x="12" y="92" fill="#cbd5e1" font-size="12" font-family="Segoe UI">remove spec_sequence_</text>
    <text x="12" y="110" fill="#cbd5e1" font-size="12" font-family="Segoe UI">masks is None assert</text>
    <text x="12" y="138" fill="#fda4af" font-size="11" font-family="Segoe UI" font-style="italic">mask is metadata-only,</text>
    <text x="12" y="156" fill="#fda4af" font-size="11" font-family="Segoe UI" font-style="italic">never reaches SYCL</text>
  </g>

  <!-- arrow down to result -->
  <line x1="540" y1="310" x2="540" y2="360" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- result box -->
  <g transform="translate(330, 370)">
    <rect x="0" y="0" width="420" height="140" rx="16" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="2" filter="url(#glow2)"/>
    <text x="210" y="40" fill="#6ee7b7" font-size="15" font-family="Segoe UI" text-anchor="middle" font-weight="700">RUN 18 RESULT — MTP UNLOCKED</text>
    <text x="210" y="96" fill="#34d399" font-size="46" font-family="Segoe UI" text-anchor="middle" font-weight="800">126 t/s</text>
    <text x="210" y="124" fill="#a7f3d0" font-size="14" font-family="Segoe UI" text-anchor="middle">+73% over baseline · 1.8× over llama.cpp · byte-identical greedy output</text>
  </g>

  <!-- verdict callout -->
  <g transform="translate(72, 500)">
    <text x="0" y="0" fill="#64748b" font-size="13" font-family="Segoe UI, Inter, Arial, sans-serif">
      The "XPU GDN incompatible with speculative decoding" verdict was wrong — an overcautious assert, not a real kernel limit.
    </text>
  </g>
</svg>
