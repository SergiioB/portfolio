<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="monospace">
  <rect width="640" height="240" rx="14" fill="#0d1117"/>
  <text x="20" y="28" fill="#bc8cff" font-size="13" font-weight="bold">MoE: router activates only top-K experts per token</text>

  <!-- token -->
  <rect x="30" y="100" width="80" height="44" rx="8" fill="none" stroke="#c9d1d9" stroke-width="1.5"/>
  <text x="70" y="127" fill="#c9d1d9" font-size="12" text-anchor="middle">token</text>

  <!-- router -->
  <rect x="160" y="100" width="80" height="44" rx="8" fill="none" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="200" y="127" fill="#bc8cff" font-size="12" text-anchor="middle">router</text>

  <!-- experts -->
  <g font-size="11" text-anchor="middle">
    <rect x="320" y="40"  width="90" height="36" rx="6" fill="none" stroke="#56d364" stroke-width="2"/>
    <text x="365" y="63" fill="#56d364">E1 ✓</text>
    <rect x="320" y="90"  width="90" height="36" rx="6" fill="none" stroke="#30363d"/>
    <text x="365" y="113" fill="#484f58">E2</text>
    <rect x="320" y="140" width="90" height="36" rx="6" fill="none" stroke="#56d364" stroke-width="2"/>
    <text x="365" y="163" fill="#56d364">E3 ✓</text>
    <rect x="320" y="190" width="90" height="36" rx="6" fill="none" stroke="#30363d"/>
    <text x="365" y="213" fill="#484f58">E4 …</text>
  </g>

  <!-- edges -->
  <g stroke="#30363d" stroke-width="1.5" fill="none">
    <path d="M110 122 H160"/><path d="M240 122 H320"/>
  </g>
  <g stroke="#56d364" stroke-width="2" fill="none">
    <path d="M240 116 L320 58"><animate attributeName="stroke-opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></path>
    <path d="M240 128 L320 158"><animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></path>
  </g>

  <!-- active pulses -->
  <circle r="4" fill="#bc8cff"><animateMotion dur="2.6s" repeatCount="indefinite" path="M110 122 H160"/></circle>
  <circle r="4" fill="#56d364"><animateMotion dur="3s" begin="0.4s" repeatCount="indefinite" path="M240 116 L320 58"/></circle>

  <text x="20" y="232" fill="#8b949e" font-size="11">Only 2 of N experts run per token → 3B active of a 35B model → fast decode.</text>
</svg>
