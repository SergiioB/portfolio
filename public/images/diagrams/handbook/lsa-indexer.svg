<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="monospace">
  <rect width="640" height="240" rx="14" fill="#0d1117"/>
  <text x="20" y="28" fill="#58a6ff" font-size="13" font-weight="bold">LSA: indexer picks top-K keys, skips the rest</text>

  <!-- query -->
  <rect x="30" y="100" width="80" height="44" rx="8" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="70" y="127" fill="#58a6ff" font-size="12" text-anchor="middle">query</text>

  <!-- indexer -->
  <rect x="160" y="100" width="90" height="44" rx="8" fill="none" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="205" y="127" fill="#bc8cff" font-size="12" text-anchor="middle">indexer</text>

  <!-- key pool -->
  <g font-size="10" text-anchor="middle">
    <rect x="320" y="40"  width="44" height="32" rx="5" fill="none" stroke="#56d364" stroke-width="2"/><text x="342" y="60" fill="#56d364">K</text>
    <rect x="372" y="40"  width="44" height="32" rx="5" fill="none" stroke="#30363d"/><text x="394" y="60" fill="#484f58">K</text>
    <rect x="424" y="40"  width="44" height="32" rx="5" fill="none" stroke="#56d364" stroke-width="2"/><text x="446" y="60" fill="#56d364">K</text>
    <rect x="476" y="40"  width="44" height="32" rx="5" fill="none" stroke="#30363d"/><text x="498" y="60" fill="#484f58">K</text>
    <rect x="528" y="40"  width="44" height="32" rx="5" fill="none" stroke="#30363d"/><text x="550" y="60" fill="#484f58">K</text>
    <rect x="320" y="90"  width="44" height="32" rx="5" fill="none" stroke="#30363d"/><text x="342" y="110" fill="#484f58">K</text>
    <rect x="372" y="90"  width="44" height="32" rx="5" fill="none" stroke="#56d364" stroke-width="2"/><text x="394" y="110" fill="#56d364">K</text>
    <rect x="424" y="90"  width="44" height="32" rx="5" fill="none" stroke="#30363d"/><text x="446" y="110" fill="#484f58">K</text>
    <rect x="476" y="90"  width="44" height="32" rx="5" fill="none" stroke="#30363d"/><text x="498" y="110" fill="#484f58">K</text>
    <rect x="528" y="90"  width="44" height="32" rx="5" fill="none" stroke="#30363d"/><text x="550" y="110" fill="#484f58">K</text>
  </g>

  <!-- scan beam from indexer across keys -->
  <rect x="320" y="36" width="60" height="90" fill="#58a6ff" opacity="0.12">
    <animate attributeName="x" values="320;520;320" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <g stroke="#30363d" stroke-width="1.5" fill="none"><path d="M110 122 H160"/><path d="M250 122 H320"/></g>

  <circle r="4" fill="#58a6ff"><animateMotion dur="1.2s" repeatCount="indefinite" path="M110 122 H160"/></circle>
  <circle r="4" fill="#56d364"><animateMotion dur="1.6s" begin="0.3s" repeatCount="indefinite" path="M250 122 L342 56"/></circle>

  <text x="20" y="232" fill="#8b949e" font-size="11">Attend to K relevant keys, not all N → O(N·K) instead of O(N²). Enables 500K+.</text>
</svg>
