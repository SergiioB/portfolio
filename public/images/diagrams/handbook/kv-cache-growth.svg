<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="monospace">
  <rect width="640" height="240" rx="14" fill="#0d1117"/>
  <text x="20" y="28" fill="#56d364" font-size="13" font-weight="bold">KV CACHE: grows +1 slot per generated token</text>

  <!-- cache slots -->
  <g>
    <rect x="30"  y="70" width="52" height="60" rx="6" fill="#161b22" stroke="#56d364" stroke-width="1.5"/>
    <rect x="92"  y="70" width="52" height="60" rx="6" fill="#161b22" stroke="#56d364" stroke-width="1.5"/>
    <rect x="154" y="70" width="52" height="60" rx="6" fill="#161b22" stroke="#56d364" stroke-width="1.5"/>
    <rect x="216" y="70" width="52" height="60" rx="6" fill="#161b22" stroke="#56d364" stroke-width="1.5"/>
    <!-- new slot appears -->
    <rect x="278" y="70" width="52" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2">
      <animate attributeName="opacity" values="0;1;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="340" y="70" width="52" height="60" rx="6" fill="none" stroke="#30363d" stroke-dasharray="4 4"/>
    <rect x="402" y="70" width="52" height="60" rx="6" fill="none" stroke="#30363d" stroke-dasharray="4 4"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#8b949e">
    <text x="56" y="105">K·V</text><text x="118" y="105">K·V</text><text x="180" y="105">K·V</text><text x="242" y="105">K·V</text>
    <text x="304" y="105" fill="#58a6ff">new</text>
    <text x="366" y="105">…</text><text x="428" y="105">…</text>
  </g>

  <!-- VRAM bar grows -->
  <text x="30" y="170" fill="#8b949e" font-size="11">VRAM used by cache</text>
  <rect x="30" y="180" width="560" height="18" rx="9" fill="#161b22" stroke="#30363d"/>
  <rect x="30" y="180" width="120" height="18" rx="9" fill="#56d364">
    <animate attributeName="width" values="120;320;320" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <text x="20" y="226" fill="#8b949e" font-size="11">Linear growth: 256K context ⇒ 10GB+ of VRAM → quantize V to Q4 to fit.</text>
</svg>
