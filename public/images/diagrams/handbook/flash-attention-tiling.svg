<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="monospace">
  <rect width="640" height="240" rx="14" fill="#0d1117"/>
  <text x="20" y="28" fill="#e3b341" font-size="13" font-weight="bold">FLASH ATTENTION: tile in fast SRAM, only write result to HBM</text>

  <!-- HBM (slow, big) -->
  <rect x="30" y="60" width="180" height="140" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
  <text x="120" y="84" fill="#8b949e" font-size="12" text-anchor="middle">HBM (slow)</text>
  <g fill="#21262d" stroke="#30363d">
    <rect x="45" y="95" width="70" height="40" rx="4"/><rect x="125" y="95" width="70" height="40" rx="4"/>
    <rect x="45" y="145" width="70" height="40" rx="4"/><rect x="125" y="145" width="70" height="40" rx="4"/>
  </g>

  <!-- SRAM (fast, small) -->
  <rect x="330" y="60" width="140" height="140" rx="10" fill="#161b22" stroke="#56d364" stroke-width="2"/>
  <text x="400" y="84" fill="#56d364" font-size="12" text-anchor="middle">SRAM (fast)</text>
  <rect x="350" y="100" width="100" height="80" rx="6" fill="none" stroke="#56d364" stroke-dasharray="5 4">
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/>
  </rect>
  <text x="400" y="145" fill="#56d364" font-size="11" text-anchor="middle">tile Q·Kᵀ→softmax</text>

  <!-- arrows HBM<->SRAM -->
  <g stroke="#e3b341" stroke-width="2" fill="none">
    <path d="M210 110 H330"><animate attributeName="stroke-opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></path>
    <path d="M330 170 H210"><animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/></path>
  </g>
  <text x="270" y="100" fill="#e3b341" font-size="10" text-anchor="middle">read tile</text>
  <text x="270" y="190" fill="#56d364" font-size="10" text-anchor="middle">write result</text>

  <!-- output -->
  <rect x="520" y="100" width="90" height="60" rx="8" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="565" y="135" fill="#58a6ff" font-size="11" text-anchor="middle">O</text>
  <path d="M470 130 H520" stroke="#58a6ff" stroke-width="2" fill="none"/>

  <text x="20" y="226" fill="#8b949e" font-size="11">O(N²) HBM traffic → tiled compute in SRAM. Memory-bound becomes compute-bound.</text>
</svg>
