<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="monospace">
  <rect width="640" height="300" rx="14" fill="#0d1117"/>
  <text x="20" y="28" fill="#bc8cff" font-size="13" font-weight="bold">SOFTMAX: raw scores → probabilities that sum to 1</text>

  <!-- Step 1: raw scores (logits) as bars, can be negative -->
  <text x="30" y="60" fill="#8b949e" font-size="11">1. raw scores (Q·Kᵀ)</text>
  <g>
    <line x1="30" y1="120" x2="190" y2="120" stroke="#30363d"/>
    <rect x="40"  y="80"  width="26" height="40" fill="#58a6ff"><animate attributeName="height" values="10;40;40" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="76"  y="100" width="26" height="20" fill="#58a6ff"><animate attributeName="height" values="6;20;20" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="112" y="70"  width="26" height="50" fill="#58a6ff"><animate attributeName="height" values="12;50;50" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="148" y="112" width="26" height="8"  fill="#58a6ff"><animate attributeName="height" values="3;8;8" dur="5s" repeatCount="indefinite"/></rect>
  </g>
  <text x="30" y="140" fill="#484f58" font-size="10">2.0  0.5  3.0  0.1</text>

  <!-- arrow -->
  <text x="215" y="105" fill="#e3b341" font-size="14">→ eˣ</text>

  <!-- Step 2: exp (all positive, big wins) -->
  <text x="260" y="60" fill="#8b949e" font-size="11">2. exponentiate</text>
  <g>
    <line x1="260" y1="120" x2="420" y2="120" stroke="#30363d"/>
    <rect x="270" y="95"  width="26" height="25" fill="#e3b341"><animate attributeName="height" values="8;25;25" dur="5s" begin="1.2s" repeatCount="indefinite"/></rect>
    <rect x="306" y="112" width="26" height="8"  fill="#e3b341"><animate attributeName="height" values="3;8;8" dur="5s" begin="1.2s" repeatCount="indefinite"/></rect>
    <rect x="342" y="70"  width="26" height="50" fill="#e3b341"><animate attributeName="height" values="14;50;50" dur="5s" begin="1.2s" repeatCount="indefinite"/></rect>
    <rect x="378" y="117" width="26" height="3"  fill="#e3b341"><animate attributeName="height" values="1;3;3" dur="5s" begin="1.2s" repeatCount="indefinite"/></rect>
  </g>
  <text x="260" y="140" fill="#484f58" font-size="10">7.4  1.6  20.1  1.1</text>

  <!-- arrow -->
  <text x="435" y="105" fill="#56d364" font-size="12">÷ Σ</text>

  <!-- Step 3: normalize to probabilities -->
  <text x="480" y="60" fill="#8b949e" font-size="11">3. normalize</text>
  <g>
    <line x1="480" y1="120" x2="620" y2="120" stroke="#30363d"/>
    <rect x="490" y="100" width="26" height="20" fill="#56d364"><animate attributeName="height" values="6;20;20" dur="5s" begin="2.6s" repeatCount="indefinite"/></rect>
    <rect x="526" y="116" width="26" height="4"  fill="#56d364"><animate attributeName="height" values="1;4;4" dur="5s" begin="2.6s" repeatCount="indefinite"/></rect>
    <rect x="562" y="66"  width="26" height="54" fill="#56d364"><animate attributeName="height" values="16;54;54" dur="5s" begin="2.6s" repeatCount="indefinite"/></rect>
  </g>
  <text x="480" y="140" fill="#484f58" font-size="10">.25  .05  .66  .04</text>

  <!-- explanation -->
  <text x="20" y="180" fill="#c9d1d9" font-size="12">Why exponentiate? It makes everything positive and amplifies the largest score,</text>
  <text x="20" y="198" fill="#c9d1d9" font-size="12">so the most relevant token wins most of the "attention weight".</text>
  <text x="20" y="226" fill="#8b949e" font-size="12">Why normalize? So the weights sum to 1 — the output becomes a weighted</text>
  <text x="20" y="244" fill="#8b949e" font-size="12">average of the Values, not an unbounded sum.</text>
  <text x="20" y="282" fill="#58a6ff" font-size="12">softmax(xᵢ) = eˣⁱ / Σⱼ eʲ</text>
</svg>
