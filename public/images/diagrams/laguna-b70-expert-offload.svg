<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="676" viewBox="0 0 1200 676" role="img" aria-label="Laguna S 2.1 partial expert offload benchmark on Intel Arc Pro B70">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="barBest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="676" rx="20" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="52" fill="#f8fafc" font-size="30" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="700">Laguna S 2.1 (118B MoE) on a single Arc Pro B70 32GB</text>
  <text x="60" y="82" fill="#94a3b8" font-size="17" font-family="Segoe UI, Inter, Arial, sans-serif">Partial expert offload: one regex flag, 3.2x speedup</text>

  <!-- Chart area -->
  <rect x="60" y="110" width="700" height="440" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1"/>

  <!-- Y axis labels -->
  <text x="50" y="530" fill="#64748b" font-size="13" font-family="Consolas, monospace" text-anchor="end">0</text>
  <text x="50" y="430" fill="#64748b" font-size="13" font-family="Consolas, monospace" text-anchor="end">5</text>
  <text x="50" y="330" fill="#64748b" font-size="13" font-family="Consolas, monospace" text-anchor="end">10</text>
  <text x="50" y="230" fill="#64748b" font-size="13" font-family="Consolas, monospace" text-anchor="end">15</text>
  <text x="50" y="145" fill="#64748b" font-size="13" font-family="Consolas, monospace" text-anchor="end">20</text>

  <!-- Grid lines -->
  <line x1="70" y1="525" x2="740" y2="525" stroke="#1e293b" stroke-width="1"/>
  <line x1="70" y1="425" x2="740" y2="425" stroke="#1e293b" stroke-width="1"/>
  <line x1="70" y1="325" x2="740" y2="325" stroke="#1e293b" stroke-width="1"/>
  <line x1="70" y1="225" x2="740" y2="225" stroke="#1e293b" stroke-width="1"/>
  <line x1="70" y1="140" x2="740" y2="140" stroke="#1e293b" stroke-width="1"/>

  <!-- Bars: baseline 4.8, 24L 8.1, 34L 10.2, 36L 12.7, 40L 15.3 -->
  <!-- Bar height = value * 20px per t/s, baseline y=525 -->
  <!-- 4.8 -> h=96, y=429 -->
  <rect x="100" y="429" width="80" height="96" rx="6" fill="url(#barGrad)" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.7;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="140" y="420" fill="#94a3b8" font-size="15" font-family="Consolas, monospace" text-anchor="middle">4.8</text>
  <text x="140" y="548" fill="#94a3b8" font-size="12" font-family="Segoe UI, Inter, Arial, sans-serif" text-anchor="middle">0 GPU</text>

  <!-- 8.1 -> h=162, y=363 -->
  <rect x="220" y="363" width="80" height="162" rx="6" fill="url(#barGrad)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.8;0.6" dur="3s" begin="0.3s" repeatCount="indefinite"/>
  </rect>
  <text x="260" y="354" fill="#94a3b8" font-size="15" font-family="Consolas, monospace" text-anchor="middle">8.1</text>
  <text x="260" y="548" fill="#94a3b8" font-size="12" font-family="Segoe UI, Inter, Arial, sans-serif" text-anchor="middle">24 GPU</text>

  <!-- 10.2 -> h=204, y=321 -->
  <rect x="340" y="321" width="80" height="204" rx="6" fill="url(#barGrad)" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.9;0.7" dur="3s" begin="0.6s" repeatCount="indefinite"/>
  </rect>
  <text x="380" y="312" fill="#94a3b8" font-size="15" font-family="Consolas, monospace" text-anchor="middle">10.2</text>
  <text x="380" y="548" fill="#94a3b8" font-size="12" font-family="Segoe UI, Inter, Arial, sans-serif" text-anchor="middle">34 GPU</text>

  <!-- 12.7 -> h=254, y=271 -->
  <rect x="460" y="271" width="80" height="254" rx="6" fill="url(#barGrad)" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" begin="0.9s" repeatCount="indefinite"/>
  </rect>
  <text x="500" y="262" fill="#94a3b8" font-size="15" font-family="Consolas, monospace" text-anchor="middle">12.7</text>
  <text x="500" y="548" fill="#94a3b8" font-size="12" font-family="Segoe UI, Inter, Arial, sans-serif" text-anchor="middle">36 GPU</text>

  <!-- 15.3 -> h=306, y=219 — BEST -->
  <rect x="580" y="219" width="80" height="306" rx="6" fill="url(#barBest)" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.85;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="620" y="208" fill="#22d3ee" font-size="18" font-family="Consolas, monospace" text-anchor="middle" font-weight="700">15.3</text>
  <text x="620" y="548" fill="#22d3ee" font-size="13" font-family="Segoe UI, Inter, Arial, sans-serif" text-anchor="middle" font-weight="700">40 GPU</text>

  <!-- OOM marker -->
  <rect x="700" y="140" width="30" height="385" rx="4" fill="#ef4444" opacity="0.15"/>
  <text x="715" y="132" fill="#f87171" font-size="12" font-family="Consolas, monospace" text-anchor="middle">OOM</text>
  <text x="715" y="548" fill="#f87171" font-size="12" font-family="Segoe UI, Inter, Arial, sans-serif" text-anchor="middle">44 GPU</text>

  <!-- Y axis title -->
  <text x="28" y="340" fill="#cbd5e1" font-size="15" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="600" transform="rotate(-90 28 340)" text-anchor="middle">Gen t/s</text>

  <!-- Right panel: architecture -->
  <rect x="790" y="110" width="370" height="440" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="975" y="145" fill="#f8fafc" font-size="18" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="700" text-anchor="middle">Layer split (48 total)</text>

  <!-- GPU layers block -->
  <rect x="820" y="170" width="310" height="200" rx="12" fill="#10b981" opacity="0.12" stroke="#10b981" stroke-width="1.5"/>
  <text x="975" y="198" fill="#a7f3d0" font-size="16" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="700" text-anchor="middle">GPU VRAM (~24 GB)</text>
  <text x="975" y="225" fill="#6ee7b7" font-size="14" font-family="Consolas, monospace" text-anchor="middle">Layers 0–39 experts</text>
  <text x="975" y="250" fill="#6ee7b7" font-size="14" font-family="Consolas, monospace" text-anchor="middle">+ attention + dense</text>
  <text x="975" y="280" fill="#94a3b8" font-size="13" font-family="Segoe UI, Inter, Arial, sans-serif" text-anchor="middle">40 of 48 layers on GPU</text>

  <!-- Arrow -->
  <line x1="975" y1="375" x2="975" y2="400" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#64748b"/></marker></defs>

  <!-- CPU layers block -->
  <rect x="820" y="405" width="310" height="120" rx="12" fill="#f59e0b" opacity="0.12" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="975" y="435" fill="#fcd34d" font-size="16" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="700" text-anchor="middle">CPU RAM (~8 GB)</text>
  <text x="975" y="462" fill="#fbbf24" font-size="14" font-family="Consolas, monospace" text-anchor="middle">Layers 40–47 experts</text>
  <text x="975" y="490" fill="#94a3b8" font-size="13" font-family="Segoe UI, Inter, Arial, sans-serif" text-anchor="middle">8 of 48 layers on CPU</text>

  <!-- Bottom: the flag -->
  <rect x="60" y="570" width="1100" height="80" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="80" y="600" fill="#94a3b8" font-size="14" font-family="Segoe UI, Inter, Arial, sans-serif">The entire fix:</text>
  <text x="80" y="630" fill="#38bdf8" font-size="17" font-family="Consolas, monospace" font-weight="600">-ot "blk\.(4[0-9])\.ffn_.*_exps\.=CPU"</text>
  <text x="750" y="618" fill="#64748b" font-size="14" font-family="Segoe UI, Inter, Arial, sans-serif">llama.cpp Poolside fork 04b2b72 · SYCL · oneAPI 2026.0</text>
</svg>
