<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="676" viewBox="0 0 1200 676" role="img" aria-label="Laguna S 2.1 118B MoE partial expert offload sweep on Intel Arc Pro B70 32GB: 4.8 to 15.3 tokens per second">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#101a2e"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.28"/>
    </pattern>
    <linearGradient id="curveStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="sweepPath" d="M100,429 C 250,395 350,375 427,366 C 500,357 540,340 564,326 C 590,311 615,270 645,229"/>
  </defs>

  <rect width="1200" height="676" fill="url(#bg)"/>
  <rect width="1200" height="676" fill="url(#grid)"/>

  <!-- Title block -->
  <text x="48" y="48" fill="#f8fafc" font-size="25" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif">Laguna S 2.1 · 118B MoE on one Arc Pro B70 32GB</text>
  <text x="48" y="74" fill="#94a3b8" font-size="13" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">partial expert offload · poolside fork 04b2b72 · SYCL / oneAPI 2026.0</text>

  <!-- Spec chips -->
  <g font-family="ui-monospace, Consolas, monospace" font-size="12">
    <rect x="48" y="86" width="150" height="24" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="123" y="102" fill="#94a3b8" text-anchor="middle">IQ2_XXS · 34.6 GB</text>
    <rect x="206" y="86" width="160" height="24" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="286" y="102" fill="#94a3b8" text-anchor="middle">256 experts · top-10</text>
    <rect x="374" y="86" width="140" height="24" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="444" y="102" fill="#94a3b8" text-anchor="middle">8B active/token</text>
  </g>

  <!-- Headline number -->
  <text x="1152" y="66" fill="#22d3ee" font-size="54" font-weight="700" text-anchor="end" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" filter="url(#glow)">15.3<tspan font-size="22" fill="#94a3b8"> t/s</tspan></text>
  <text x="1152" y="92" fill="#94a3b8" font-size="13" text-anchor="end" font-family="'Segoe UI', system-ui, sans-serif">generation · <tspan fill="#34d399" font-weight="700">3.2x</tspan> vs all-experts-CPU</text>

  <!-- ============ SWEEP CHART ============ -->
  <rect x="48" y="128" width="712" height="432" rx="14" fill="#0f172a" stroke="#334155"/>
  <text x="68" y="156" fill="#e2e8f0" font-size="15" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif">Generation throughput vs expert layers on GPU</text>

  <!-- gridlines + y labels -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="100" y1="425" x2="720" y2="425"/>
    <line x1="100" y1="330" x2="720" y2="330"/>
    <line x1="100" y1="235" x2="720" y2="235"/>
  </g>
  <g fill="#64748b" font-size="12" font-family="ui-monospace, Consolas, monospace" text-anchor="end">
    <text x="92" y="524">0</text>
    <text x="92" y="429">5</text>
    <text x="92" y="334">10</text>
    <text x="92" y="239">15</text>
  </g>
  <text x="60" y="340" fill="#cbd5e1" font-size="12" font-weight="600" font-family="'Segoe UI', system-ui, sans-serif" transform="rotate(-90 60 340)" text-anchor="middle">gen t/s</text>

  <!-- bars -->
  <g>
    <rect x="82"  y="429" width="36" height="91"  rx="4" fill="#1e293b" stroke="#334155"/>
    <rect x="409" y="366" width="36" height="154" rx="4" fill="#1e293b" stroke="#334155"/>
    <rect x="546" y="326" width="36" height="194" rx="4" fill="#1e293b" stroke="#334155"/>
    <rect x="573" y="279" width="36" height="241" rx="4" fill="#1e293b" stroke="#334155"/>
    <rect x="627" y="229" width="36" height="291" rx="4" fill="#22d3ee" opacity="0.22" stroke="#22d3ee">
      <animate attributeName="opacity" values="0.22;0.38;0.22" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- baseline + DFlash reference -->
  <line x1="100" y1="429" x2="720" y2="429" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="716" y="421" fill="#94a3b8" font-size="11" text-anchor="end" font-family="ui-monospace, Consolas, monospace">all experts CPU: 4.8</text>
  <line x1="100" y1="425" x2="300" y2="425" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.0"/>

  <!-- DFlash annotation -->
  <g font-family="ui-monospace, Consolas, monospace">
    <rect x="140" y="470" width="210" height="22" rx="5" fill="#1e293b" stroke="#475569"/>
    <text x="245" y="485" fill="#94a3b8" font-size="11" text-anchor="middle">DFlash tuned: 5.0 t/s = noise</text>
  </g>

  <!-- sweep curve -->
  <use href="#sweepPath" fill="none" stroke="url(#curveStroke)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- OOM zone -->
  <path d="M645,229 L700,300" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="7 6"/>
  <g stroke="#ef4444" stroke-width="3.5" stroke-linecap="round">
    <line x1="692" y1="292" x2="708" y2="308"/>
    <line x1="708" y1="292" x2="692" y2="308"/>
  </g>
  <text x="700" y="330" fill="#f87171" font-size="12" font-weight="700" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">44: OOM</text>

  <!-- data points + labels -->
  <g font-family="ui-monospace, Consolas, monospace" text-anchor="middle">
    <circle cx="100" cy="429" r="5" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="100" y="418" fill="#94a3b8" font-size="13">4.8</text>
    <circle cx="427" cy="366" r="5" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="427" y="356" fill="#94a3b8" font-size="13">8.1</text>
    <circle cx="564" cy="326" r="5" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="564" y="308" fill="#94a3b8" font-size="13">10.2</text>
    <circle cx="591" cy="279" r="5" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="591" y="269" fill="#94a3b8" font-size="13">12.7</text>
    <circle cx="645" cy="229" r="7" fill="#22d3ee" filter="url(#glow)"/>
    <text x="645" y="212" fill="#22d3ee" font-size="16" font-weight="700">15.3</text>
  </g>

  <!-- moving marker along the sweep (ping-pong loop) -->
  <circle r="9" fill="none" stroke="#f8fafc" stroke-width="2.5" opacity="0.9">
    <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1;0;0" keyTimes="0;0.4;0.5;0.9;1">
      <mpath href="#sweepPath"/>
    </animateMotion>
  </circle>

  <!-- x labels -->
  <g fill="#94a3b8" font-size="12" font-family="ui-monospace, Consolas, monospace" text-anchor="middle">
    <text x="100" y="542">0</text>
    <text x="427" y="542">24</text>
    <text x="564" y="542">34</text>
    <text x="591" y="542">36</text>
    <text x="645" y="542" fill="#22d3ee" font-weight="700">40</text>
    <text x="700" y="542" fill="#f87171">44</text>
  </g>
  <text x="400" y="556" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif">expert layers resident on GPU (of 48)</text>

  <!-- ============ LAYER STACK ============ -->
  <rect x="788" y="128" width="364" height="432" rx="14" fill="#0f172a" stroke="#334155"/>
  <text x="808" y="156" fill="#e2e8f0" font-size="15" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif">48 layers · expert placement</text>

  <!-- scanning token band -->
  <rect x="850" y="144" width="170" height="26" fill="url(#scanGrad)">
    <animate attributeName="y" values="144;500;144" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- 48 layer bars: 0-39 GPU green, 40-47 CPU amber -->
  <g>
    <rect x="850" y="170" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="177.5" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="185" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="192.5" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="200" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="207.5" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="215" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="222.5" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="230" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="237.5" width="170" height="5" fill="#10b981" opacity="0.55"/>
    <rect x="850" y="245" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="252.5" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="260" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="267.5" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="275" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="282.5" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="290" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="297.5" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="305" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="312.5" width="170" height="5" fill="#10b981" opacity="0.55"/>
    <rect x="850" y="320" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="327.5" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="335" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="342.5" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="350" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="357.5" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="365" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="372.5" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="380" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="387.5" width="170" height="5" fill="#10b981" opacity="0.55"/>
    <rect x="850" y="395" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="402.5" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="410" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="417.5" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="425" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="432.5" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="440" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="447.5" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="455" width="170" height="5" fill="#10b981" opacity="0.55"/><rect x="850" y="462.5" width="170" height="5" fill="#10b981" opacity="0.55"/>
    <!-- CPU layers 40-47 -->
    <rect x="850" y="470" width="170" height="5" fill="#f59e0b" opacity="0.6"/><rect x="850" y="477.5" width="170" height="5" fill="#f59e0b" opacity="0.6"/><rect x="850" y="485" width="170" height="5" fill="#f59e0b" opacity="0.6"/><rect x="850" y="492.5" width="170" height="5" fill="#f59e0b" opacity="0.6"/><rect x="850" y="500" width="170" height="5" fill="#f59e0b" opacity="0.6"/><rect x="850" y="507.5" width="170" height="5" fill="#f59e0b" opacity="0.6"/><rect x="850" y="515" width="170" height="5" fill="#f59e0b" opacity="0.6"/><rect x="850" y="522.5" width="170" height="5" fill="#f59e0b" opacity="0.6"/>
  </g>

  <!-- active expert pulses (top-10 routing) -->
  <g fill="#22d3ee">
    <circle cx="880" cy="217" r="3.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="1.8s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="277" r="3.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="1.8s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="910" cy="337" r="3.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="1.8s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="995" cy="397" r="3.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="1.8s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="442" r="3.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="935" cy="497" r="3.5" fill="#fbbf24"><animate attributeName="opacity" values="0.1;1;0.1" dur="1.8s" begin="1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- split line -->
  <line x1="838" y1="467" x2="1132" y2="467" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- index labels -->
  <g fill="#64748b" font-size="11" font-family="ui-monospace, Consolas, monospace" text-anchor="end">
    <text x="842" y="176">0</text>
    <text x="842" y="466">39</text>
    <text x="842" y="476">40</text>
    <text x="842" y="528">47</text>
  </g>

  <!-- zone labels -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <text x="1040" y="300" fill="#a7f3d0" font-size="14" font-weight="700">GPU VRAM</text>
    <text x="1040" y="318" fill="#6ee7b7" font-size="12" font-family="ui-monospace, Consolas, monospace">~24 GB · 40 layers</text>
    <text x="1040" y="500" fill="#fcd34d" font-size="14" font-weight="700">CPU RAM</text>
    <text x="1040" y="518" fill="#fbbf24" font-size="12" font-family="ui-monospace, Consolas, monospace">~8 GB · 8 layers</text>
  </g>

  <!-- ============ BOTTOM TERMINAL STRIP ============ -->
  <rect x="48" y="580" width="1104" height="72" rx="12" fill="#0f172a" stroke="#334155"/>
  <circle cx="74" cy="616" r="5" fill="#ef4444" opacity="0.7"/>
  <circle cx="92" cy="616" r="5" fill="#f59e0b" opacity="0.7"/>
  <circle cx="110" cy="616" r="5" fill="#10b981" opacity="0.7"/>
  <text x="132" y="622" fill="#34d399" font-size="16" font-family="ui-monospace, Consolas, monospace">$</text>
  <text x="152" y="622" fill="#38bdf8" font-size="16" font-weight="600" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">-ot "blk\.(4[0-9])\.ffn_.*_exps\.=CPU"</text>
  <rect x="548" y="606" width="9" height="20" fill="#22d3ee">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="1128" y="622" fill="#94a3b8" font-size="13" text-anchor="end" font-family="'Segoe UI', system-ui, sans-serif">one flag · no code changes · no spec decode</text>
</svg>
