<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="rpcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="cascGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <style>
      .text-base { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .text-heavy { font-weight: 700; }
      .text-medium { font-weight: 500; }
      .text-light { font-weight: 400; fill: #9ca3af; }
      .axis-label { fill: #9ca3af; font-size: 12px; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#111827" rx="8" />

  <text x="40" y="50" class="text-base text-heavy" fill="#f3f4f6" font-size="24">The Distributed Inference Penalty</text>
  <text x="40" y="75" class="text-base text-medium" fill="#9ca3af" font-size="14">Performance retained when splitting Qwen3.8-27B across devices</text>

  <!-- Base Line Grid -->
  <line x1="200" y1="110" x2="200" y2="440" stroke="#374151" stroke-width="2" />
  <line x1="200" y1="440" x2="740" y2="440" stroke="#374151" stroke-width="2" />

  <text x="200" y="460" class="text-base axis-label" text-anchor="middle">0%</text>
  <text x="470" y="460" class="text-base axis-label" text-anchor="middle">50%</text>
  <text x="740" y="460" class="text-base axis-label" text-anchor="end">100% baseline</text>

  <!-- 100% & 50% Marker Lines -->
  <line x1="740" y1="110" x2="740" y2="440" stroke="#374151" stroke-width="1" stroke-dasharray="4" />
  <line x1="470" y1="110" x2="470" y2="440" stroke="#374151" stroke-width="1" stroke-dasharray="4" />

  <!-- Bar 1: RPC Local (desktop only) -->
  <text x="180" y="160" class="text-base text-medium" fill="#f3f4f6" font-size="16" text-anchor="end">Naive RPC · PCIe</text>
  <text x="180" y="180" class="text-base text-light" font-size="12" text-anchor="end">2× B70 · base 76.1 tok/s</text>

  <rect x="202" y="145" width="292" height="40" fill="url(#rpcGrad)" rx="4" />
  <text x="504" y="160" class="text-base text-heavy" fill="#ef4444" font-size="16">54% retained</text>
  <text x="504" y="180" class="text-base text-light" font-size="12">40.8 tok/s (vs 76.1)</text>

  <!-- separator -->
  <line x1="40" y1="215" x2="760" y2="215" stroke="#1f2937" stroke-width="1" />

  <!-- Bar 2: RPC cross-machine WiFi -->
  <text x="180" y="270" class="text-base text-medium" fill="#f3f4f6" font-size="16" text-anchor="end">Naive RPC · WiFi</text>
  <text x="180" y="290" class="text-base text-light" font-size="12" text-anchor="end">B70 + laptop CPU · llama.cpp</text>

  <rect x="202" y="255" width="174" height="40" fill="url(#rpcGrad)" rx="4" />
  <text x="386" y="270" class="text-base text-heavy" fill="#ef4444" font-size="16">32% retained</text>
  <text x="386" y="290" class="text-base text-light" font-size="12">24.5 tok/s (vs 76.1)</text>

  <!-- separator -->
  <line x1="40" y1="335" x2="760" y2="335" stroke="#1f2937" stroke-width="1" />

  <!-- Bar 3: Cascadia Local -->
  <text x="180" y="390" class="text-base text-medium" fill="#f3f4f6" font-size="16" text-anchor="end">Cascadia · PCIe</text>
  <text x="180" y="410" class="text-base text-light" font-size="12" text-anchor="end">2× B70 · OpenVINO GenAI</text>
  <text x="180" y="426" class="text-base text-light" font-size="12" text-anchor="end">22.7 tok/s base</text>

  <rect x="202" y="375" width="400" height="40" fill="url(#cascGrad)" rx="4" />
  <text x="612" y="390" class="text-base text-heavy" fill="#8b5cf6" font-size="16">83% retained</text>
  <text x="612" y="410" class="text-base text-light" font-size="12">18.9 tok/s (vs 22.7)</text>

  <!-- Footnote -->
  <text x="40" y="495" class="text-base text-light" font-size="11">Retention vs each engine's own single-device baseline. Cascadia over WiFi was not measured yet — llama.cpp SYCL kernels</text>
  <text x="40" y="511" class="text-base text-light" font-size="11">are faster on one node than OpenVINO GenAI, so compare retention, not absolute tok/s.</text>

</svg>
